<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Vue Template</title>
    <!-- Import Styles -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/styles.css" />
    <!-- Import Vue.js -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.20.0/dist/axios.min.js"></script>
</head>

<body>
    <div id="app">
        <div class="nav-bar"></div>

        <h1>{{ intro }}</h1>
        <div>
            <div class="row m-1">
                <div class="form-group mx-sm-3 mb-2">
                    <button @click="getAll" class="btn btn-primary mb-2">Get All</button>
                </div>
            </div>
            <div class="row m-1">
                <form class="form-inline" @submit.prevent="getById">
                    <div class="form-group mx-sm-3 mb-2">
                        <input v-model="getId" type="number" placeholder="enter todo Id" class="form-control">
                    </div>
                    <button type="submit" class="btn btn-primary mb-2">Search</button>
                </form>
            </div>
            <div class="row m-1">
                <div class="form-group mx-sm-3 mb-2">
                    <button @click="clearList" class="btn btn-danger mb-2">Clear list</button>
                </div>
            </div>


        </div>


        <ul>
            <li v-for="todo in list" :key="todo.id">
                userid: {{ todo.userId }} - id: {{todo.id}} - title: {{todo.title}} - completed: {{todo.completed}}
            </li>
        </ul>
    </div>

    <!-- Import App -->
    <script src="./js/main.js"></script>

    <!-- Mount App -->
    <script>
        const mountedApp = app.mount('#app')
    </script>
</body>

</html>
